# Codex CLI config — tracked in dotfiles.
# NOTE: per-project [projects.*] trust levels are intentionally NOT tracked.
# They are machine-specific state that Codex regenerates per machine, and this
# repo is public. `sync.sh --pull` strips them automatically. Do not re-add them.

model = "gpt-6-astra"
model_reasoning_effort = "medium"
personality = "pragmatic"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
file_opener = "vscode"

[sandbox_workspace_write]
network_access = true

[notice]
hide_rate_limit_model_nudge = true

[notice.model_migrations]
"gpt-5.1-codex-max" = "gpt-5.2-codex"
"gpt-5.3-codex" = "gpt-5.4"
"gpt-5.5" = "gpt-5.6-sol"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "branch-changes", "run-state", "context-remaining", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 4
"gpt-6.1-sol" = 4

